<div class="lg:flex lg:gap-3 lg:justify-center lg:items-start">
  <div class="lg:flex-1 flex flex-col">
    <app-date-filter class="lg:sticky top-[70px] z-40"/>
    <div class="mt-2 min-h-64 2xl:max-h-96 flex flex-col 2xl:flex-row 2xl:justify-stretch gap-2">
      <div class="flex-1 p-card p-4">
        <app-expense-stats [data]="stats" [loading]="statsLoading" class="h-full"/>
      </div>
      <div class="flex-1 p-card p-4">
        <app-expense-summary [data]="summary" [loading]="summaryLoad" class="h-full block"/>
      </div>
    </div>
    @let loadingClass = loading ? "visible opacity-100" : "invisible opacity-0" ;
    <p-skeleton [class]="'my-1 mx-auto block w-11/12 transition-opacity pointer-events-none ' + loadingClass" height="3px"></p-skeleton>
    <app-expense-list [expenses]='expenses' (refresh)="loadExpenses()" />
  </div>
  <p-card class="mt-5 block lg:mt-0 lg:w-96 lg:sticky top-[70px]">
    <p-button size="large" [styleClass]="'mb-4 w-full'" label="Ajouter une dépense" icon="pi pi-add" (onClick)="displayCreateForm = true" />
    <app-category-form />
    <app-category-list />
  </p-card>
</div>

<p-drawer [(visible)]="displayCreateForm" header="Ajouter une dépense" position="right" [styleClass]="'lg:!w-3/4 xl:!w-2/3 2xl:!w-1/2'">
  <app-expense-form (saved)="displayCreateForm = false; loadExpenses()" />
</p-drawer>
